<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>J.A.R.V.I.S. // 全像粒子介面</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #030b17;
      color: #bceeff;
      font-family: "Segoe UI", "Microsoft JhengHei", "Roboto", monospace;
    }
    #gl-wrap {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    /* 輕量開機光束：零模糊濾鏡、零重繪負擔 */
    #bootFlash {
      position: fixed;
      inset: 0;
      z-index: 50;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 45%, rgba(255, 184, 77, 0.12), rgba(3, 11, 23, 0.58) 68%, #020812 100%);
      opacity: 1;
      transition: opacity 0.9s ease;
    }
    #bootFlash.done {
      opacity: 0;
    }
    .boot-line {
      width: min(340px, 72vw);
      height: 2px;
      background: linear-gradient(90deg, transparent, #ffd166, #5ce1ff, #ffffff, #5ce1ff, #ffd166, transparent);
      box-shadow: 0 0 14px rgba(92, 225, 255, 0.75);
      transform: scaleX(0.15);
      transition: transform 1.1s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.65s ease;
    }
    #bootFlash.expand .boot-line {
      transform: scaleX(1);
    }
    #bootFlash.done .boot-line {
      opacity: 0;
    }
    .boot-label {
      margin-top: 12px;
      font-size: 12px;
      letter-spacing: 6px;
      color: #9beeff;
      text-shadow: 0 0 12px rgba(24, 216, 255, 0.55);
      transition: opacity 0.65s ease;
    }
    #bootFlash.done .boot-label {
      opacity: 0;
    }

    /* 頂部列 */
    .top-header {
      position: fixed;
      top: 14px;
      left: 18px;
      right: 18px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      z-index: 10;
    }
    .top-chip {
      background: rgba(5, 18, 34, 0.72);
      border: 1px solid rgba(0, 188, 255, 0.35);
      border-radius: 4px;
      padding: 6px 12px;
      font-size: 11px;
      letter-spacing: 1px;
      backdrop-filter: blur(6px);
    }
    .top-chip .accent {
      color: #5ce1ff;
      font-weight: 700;
      margin-left: 4px;
    }
    .brand-center {
      text-align: center;
      margin-top: -2px;
    }
    .brand-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 8px;
      color: #9ae8ff;
      text-shadow: 0 0 16px rgba(0, 195, 255, 0.45);
    }
    .brand-sub {
      font-size: 9px;
      letter-spacing: 3px;
      color: rgba(135, 215, 245, 0.55);
      margin-top: 2px;
    }

    /* 左右側科幻 HUD 資訊卡 */
    .side-panel {
      position: fixed;
      width: 228px;
      background: rgba(5, 18, 34, 0.68);
      border: 1px solid rgba(0, 180, 255, 0.28);
      border-radius: 5px;
      padding: 10px 12px;
      font-size: 11px;
      backdrop-filter: blur(6px);
      pointer-events: none;
      z-index: 8;
    }
    .panel-title {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #55d6ff;
      border-bottom: 1px solid rgba(0, 180, 255, 0.2);
      padding-bottom: 5px;
      margin-bottom: 8px;
    }
    .kv-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 5px;
      font-size: 11px;
    }
    .kv-row span:first-child { color: rgba(165, 215, 238, 0.72); }
    .kv-row span:last-child { color: #7ce6ff; font-weight: 600; }

    .panel-sys { top: 74px; left: 18px; }
    .panel-audio { top: 218px; left: 18px; }
    .panel-telemetry { top: 74px; right: 18px; }
    .panel-log { top: 248px; right: 18px; }

    #waveCanvas {
      display: block;
      width: 100%;
      height: 56px;
      margin-top: 2px;
    }

    .log-list {
      max-height: 122px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 10px;
      line-height: 1.4;
    }
    .log-item {
      color: rgba(175, 225, 245, 0.78);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .log-item .t { color: rgba(92, 225, 255, 0.55); margin-right: 4px; }

    /* 下方雙向對話區（我 & JARVIS）與指令輸入列 */
    .bottom-area {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: min(700px, 94vw);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      z-index: 12;
    }
    .dialogue-box {
      width: 100%;
      min-height: 76px;
      max-height: 124px;
      overflow-y: auto;
      background: rgba(4, 15, 29, 0.84);
      border: 1px solid rgba(0, 185, 255, 0.36);
      box-shadow: 0 0 20px rgba(0, 160, 255, 0.12);
      border-radius: 6px;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 12px;
      backdrop-filter: blur(8px);
    }
    .msg-line {
      display: flex;
      align-items: baseline;
      gap: 7px;
      line-height: 1.45;
      user-select: text;
    }
    .msg-badge {
      flex-shrink: 0;
      font-size: 10px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 3px;
      letter-spacing: 0.5px;
    }
    .msg-me .msg-badge {
      background: rgba(255, 168, 52, 0.22);
      border: 1px solid rgba(255, 178, 75, 0.6);
      color: #ffd085;
    }
    .msg-me .msg-text { color: #ffe5bc; }

    .msg-jarvis .msg-badge {
      background: rgba(0, 190, 255, 0.2);
      border: 1px solid rgba(0, 200, 255, 0.55);
      color: #6ce5ff;
    }
    .msg-jarvis .msg-text { color: #d6f4ff; }

    .input-bar {
      width: 100%;
      display: flex;
      gap: 8px;
      background: rgba(4, 15, 29, 0.88);
      border: 1px solid rgba(0, 185, 255, 0.36);
      border-radius: 6px;
      padding: 6px 8px;
      backdrop-filter: blur(8px);
    }
    .input-bar input,
    .input-bar select,
    .input-bar button {
      background: rgba(9, 28, 52, 0.88);
      color: #e6f7ff;
      border: 1px solid rgba(0, 185, 255, 0.35);
      border-radius: 4px;
      padding: 6px 10px;
      font-size: 12px;
      outline: none;
      user-select: text;
    }
    .input-bar input { flex: 1; }
    .input-bar button {
      cursor: pointer;
      font-weight: 600;
      background: rgba(0, 175, 255, 0.24);
      white-space: nowrap;
    }
    .input-bar button:hover { background: rgba(0, 175, 255, 0.38); }

    /* 鏡頭浮動框相容層 */
    #camDock {
      position: fixed;
      top: 74px;
      right: 260px;
      width: 280px;
      background: rgba(4, 14, 28, 0.9);
      border: 1px solid rgba(0, 185, 255, 0.55);
      border-radius: 6px;
      overflow: hidden;
      display: none;
      z-index: 25;
    }
    #camHeader {
      padding: 5px 10px;
      background: rgba(0, 175, 255, 0.18);
      font-size: 10px;
      cursor: move;
    }
    #camImg {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="gl-wrap"></div>

  <div id="bootFlash">
    <div class="boot-line"></div>
    <div class="boot-label">J.A.R.V.I.S. ONLINE</div>
  </div>

  <!-- 頂部狀態與標題 -->
  <div class="top-header">
    <div class="top-chip">系統狀態 // <span class="accent" id="topState">待命中</span></div>
    <div class="brand-center">
      <div class="brand-title">J.A.R.V.I.S.</div>
      <div class="brand-sub">全息粒子互動介面</div>
    </div>
    <div class="top-chip">光學主題 // <span class="accent" id="topTheme">青色</span></div>
  </div>

  <!-- 左側面板：系統狀態 & 音訊輸入 -->
  <div class="side-panel panel-sys">
    <div class="panel-title">系統狀態</div>
    <div class="kv-row"><span>連線狀態</span><span id="sysLink">連線中</span></div>
    <div class="kv-row"><span>運作模式</span><span id="sysState">待命中</span></div>
    <div class="kv-row"><span>視覺鏡頭</span><span id="sysVision">關閉</span></div>
    <div class="kv-row"><span>目前主題</span><span id="sysTheme">青色</span></div>
  </div>

  <div class="side-panel panel-audio">
    <div class="panel-title">音訊輸入</div>
    <canvas id="waveCanvas" width="204" height="56"></canvas>
  </div>

  <!-- 右側面板：遙測數據 & 事件紀錄 -->
  <div class="side-panel panel-telemetry">
    <div class="panel-title">遙測數據</div>
    <div class="kv-row"><span>系統時間</span><span id="telClock">--:--:--</span></div>
    <div class="kv-row"><span>運行時長</span><span id="telUptime">00:00:00</span></div>
    <div class="kv-row"><span>畫面幀率</span><span id="telFps">60</span></div>
    <div class="kv-row"><span>粒子數量</span><span id="telPoints">16,800</span></div>
    <div class="kv-row"><span>解析視窗</span><span id="telViewport">0x0</span></div>
  </div>

  <div class="side-panel panel-log">
    <div class="panel-title">事件紀錄</div>
    <div class="log-list" id="eventLogList"></div>
  </div>

  <!-- 鏡頭畫面視窗 -->
  <div id="camDock">
    <div id="camHeader">即時光學鏡頭（可拖曳）</div>
    <img id="camImg" alt="光學鏡頭畫面" />
  </div>

  <!-- 下方雙向對話（我 & JARVIS）與指令列 -->
  <div class="bottom-area">
    <div class="dialogue-box" id="dialogueBox">
      <div class="msg-line msg-jarvis">
        <span class="msg-badge">JARVIS</span>
        <span class="msg-text">對話通道已就緒，說出「嗨賈維斯」或在下方輸入指令開始對話。</span>
      </div>
    </div>

    <div class="input-bar">
      <input id="cmdInput" type="text" placeholder="輸入你想對 JARVIS 說的話，按 Enter 或點擊執行指令..." />
      <button id="sendCmdBtn">執行指令</button>
      <select id="modeSelect">
        <option value="IDLE">待命中</option>
        <option value="THINKING">思考中</option>
        <option value="SPEAKING">說話中</option>
        <option value="LISTENING">聆聽中</option>
        <option value="CAMERA_MODE">鏡頭模式</option>
      </select>
      <button id="switchModeBtn">切換狀態</button>
    </div>
  </div>

  <script type="module">
    import * as THREE from "three";
    import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
    import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
    import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";

    const STATE_ZH = {
      IDLE: "待命中",
      THINKING: "思考中",
      SPEAKING: "說話中",
      LISTENING: "聆聽中",
      CAMERA_MODE: "鏡頭模式"
    };

    const THEMES = {
      "青色": { primary: 0x18d8ff, rim: 0x8ef3ff, deep: 0x0066cc, core: 0xffa638 },
      "紅色": { primary: 0xff4545, rim: 0xff9a9a, deep: 0x991111, core: 0xffd166 },
      "金色": { primary: 0xffbe2e, rim: 0xffe699, deep: 0x8c5800, core: 0x4ce8ff },
      "紫色": { primary: 0xb66dff, rim: 0xe0bdff, deep: 0x4a198c, core: 0xffa834 },
      "綠色": { primary: 0x19e68c, rim: 0x8ff7ca, deep: 0x0a6e42, core: 0xffbe3b }
    };

    let currentState = "IDLE";
    let currentTheme = "青色";
    let currentPalette = { ...THEMES["青色"] };
    let speakTimerId = null;
    const startTimeMs = performance.now();

    const topStateEl = document.getElementById("topState");
    const topThemeEl = document.getElementById("topTheme");
    const sysStateEl = document.getElementById("sysState");
    const sysVisionEl = document.getElementById("sysVision");
    const sysThemeEl = document.getElementById("sysTheme");
    const modeSelectEl = document.getElementById("modeSelect");
    const camDockEl = document.getElementById("camDock");
    const camImgEl = document.getElementById("camImg");
    const dialogueBoxEl = document.getElementById("dialogueBox");
    const eventLogListEl = document.getElementById("eventLogList");
    const cmdInputEl = document.getElementById("cmdInput");

    function formatTimeNow() {
      const d = new Date();
      return d.toTimeString().slice(0, 8);
    }

    function pushEventLog(text) {
      const div = document.createElement("div");
      div.className = "log-item";
      div.innerHTML = `<span class="t">${formatTimeNow()}</span>${text}`;
      eventLogListEl.prepend(div);
      while (eventLogListEl.children.length > 8) {
        eventLogListEl.removeChild(eventLogListEl.lastChild);
      }
    }

    function appendMessage(speaker, text) {
      if (!text || !String(text).trim()) return;
      const cleanText = String(text).trim();
      const isMe = speaker === "我";
      const line = document.createElement("div");
      line.className = `msg-line ${isMe ? "msg-me" : "msg-jarvis"}`;
      line.innerHTML = `
        <span class="msg-badge">${isMe ? "我" : "JARVIS"}</span>
        <span class="msg-text">${cleanText}</span>
      `;
      dialogueBoxEl.appendChild(line);
      dialogueBoxEl.scrollTop = dialogueBoxEl.scrollHeight;
      pushEventLog(`${isMe ? "我" : "JARVIS"}：${cleanText}`);
    }

    function triggerSpeakingFor(durationMs = 2600) {
      applyStateUI("SPEAKING", true);
      if (speakTimerId) clearTimeout(speakTimerId);
      speakTimerId = setTimeout(() => {
        if (currentState === "SPEAKING") {
          applyStateUI("IDLE", true);
        }
      }, durationMs);
    }

    function applyStateUI(stateCode, silentLog = false) {
      currentState = STATE_ZH[stateCode] ? stateCode : "IDLE";
      const zh = STATE_ZH[currentState];
      topStateEl.textContent = zh;
      sysStateEl.textContent = zh;
      sysVisionEl.textContent = currentState === "CAMERA_MODE" ? "開啟" : "關閉";
      modeSelectEl.value = currentState;
      camDockEl.style.display = currentState === "CAMERA_MODE" ? "block" : "none";
      if (!silentLog) pushEventLog(`狀態切換 → ${zh}`);
    }

    function applyThemeUI(themeName) {
      if (!THEMES[themeName]) return;
      currentTheme = themeName;
      currentPalette = { ...THEMES[themeName] };
      topThemeEl.textContent = themeName;
      sysThemeEl.textContent = themeName;
      bodyUniforms.uColorDeep.value.setHex(currentPalette.deep);
      bodyUniforms.uColorCyan.value.setHex(currentPalette.primary);
      bodyUniforms.uColorRim.value.setHex(currentPalette.rim);
      bodyUniforms.uColorAmber.value.setHex(currentPalette.core);
      hudRingMat.color.setHex(currentPalette.primary);
      scanConeMat.color.setHex(currentPalette.primary);
      bgGridMat.color.setHex(currentPalette.primary);
      pushEventLog(`主題切換 → ${themeName}`);
    }

    const wrap = document.getElementById("gl-wrap");
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x030b17);
    scene.fog = new THREE.FogExp2(0x030b17, 0.055);

    const camera = new THREE.PerspectiveCamera(
      36,
      window.innerWidth / window.innerHeight,
      0.1,
      60
    );
    camera.position.set(0, 0.16, 4.35);
    camera.lookAt(0, 0.16, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    wrap.appendChild(renderer.domElement);

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      0.85,
      0.56,
      0.22
    );
    composer.addPass(bloomPass);

    const bgGridMat = new THREE.LineBasicMaterial({
      color: currentPalette.primary,
      transparent: true,
      opacity: 0.065,
      blending: THREE.AdditiveBlending
    });
    const bgGridGroup = new THREE.Group();
    bgGridGroup.position.set(0, -0.58, -0.4);
    bgGridGroup.rotation.x = Math.PI * 0.44;
    for (let i = -8; i <= 8; i++) {
      const span = 3.2;
      const g1 = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(i * 0.4, -span, 0),
        new THREE.Vector3(i * 0.4, span, 0)
      ]);
      const g2 = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(-span, i * 0.4, 0),
        new THREE.Vector3(span, i * 0.4, 0)
      ]);
      bgGridGroup.add(new THREE.Line(g1, bgGridMat), new THREE.Line(g2, bgGridMat));
    }
    scene.add(bgGridGroup);

    const BG_STARS = 900;
    const starGeo = new THREE.BufferGeometry();
    const starPos = new Float32Array(BG_STARS * 3);
    for (let i = 0; i < BG_STARS; i++) {
      starPos[i * 3] = (Math.random() - 0.5) * 9.0;
      starPos[i * 3 + 1] = (Math.random() - 0.5) * 5.5;
      starPos[i * 3 + 2] = -1.2 - Math.random() * 5.0;
    }
    starGeo.setAttribute("position", new THREE.BufferAttribute(starPos, 3));
    const starMat = new THREE.PointsMaterial({
      color: 0x58c8f8,
      size: 0.018,
      transparent: true,
      opacity: 0.28,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const bgStars = new THREE.Points(starGeo, starMat);
    scene.add(bgStars);

    const SHOULDER_PIVOT_Y = -0.18;
    const NECK_PIVOT_Y = 0.16;
    const HEAD_PIVOT_Y = 0.34;

    const shoulderGroup = new THREE.Group();
    shoulderGroup.position.set(0, SHOULDER_PIVOT_Y, 0);
    scene.add(shoulderGroup);

    const neckGroup = new THREE.Group();
    neckGroup.position.set(0, NECK_PIVOT_Y - SHOULDER_PIVOT_Y, 0);
    shoulderGroup.add(neckGroup);

    const headLookGroup = new THREE.Group();
    headLookGroup.position.set(0, HEAD_PIVOT_Y - NECK_PIVOT_Y, 0);
    neckGroup.add(headLookGroup);

    function sampleUpperBust(u, v) {
      const sinU = Math.sin(u);
      const cosU = Math.cos(u);
      const absU = Math.abs(u);

      let x = 0, y = 0, z = 0;
      let partId = 0;
      let zone = 0;

      if (v < 0.44) {
        partId = 2;
        const t = v / 0.44;
        const phi = t * Math.PI * 0.92;
        const sinP = Math.sin(phi);
        const cosP = Math.cos(phi);

        const jawTaper = t > 0.55 ? 1.0 - Math.pow((t - 0.55) / 0.45, 1.45) * 0.36 : 1.0;
        const rx = 0.42 * sinP * jawTaper;
        const ry = 0.53 * cosP;
        const rz = 0.47 * sinP * (0.94 + 0.06 * cosU);

        let relief = 0;
        if (cosU > 0.0) {
          const f = Math.pow(cosU, 1.5);
          const brow = Math.exp(-Math.pow((t - 0.45) / 0.07, 2)) * 0.036 * f;
          const nose = Math.exp(-Math.pow((t - 0.60) / 0.11, 2)) * Math.exp(-Math.pow(absU / 0.14, 2)) * 0.065 * f;
          const cheek = Math.exp(-Math.pow((t - 0.62) / 0.11, 2)) * Math.exp(-Math.pow((absU - 0.52) / 0.24, 2)) * 0.025 * f;
          const chin = Math.exp(-Math.pow((t - 0.90) / 0.075, 2)) * Math.exp(-Math.pow(absU / 0.22, 2)) * 0.032 * f;
          relief = brow + nose + cheek + chin;
          if (t > 0.30 && t < 0.88 && absU < 0.72) zone = 1;
        }

        x = rx * sinU;
        y = (0.78 + ry) - HEAD_PIVOT_Y;
        z = rz * cosU + relief;
      } else if (v < 0.59) {
        partId = 1;
        const t = (v - 0.44) / 0.15;
        const flare = Math.pow(t, 1.7) * 0.15;
        const rx = 0.21 + flare;
        const rz = 0.20 + flare * 0.75;

        x = rx * sinU;
        y = (0.28 - t * 0.23) - NECK_PIVOT_Y;
        z = rz * cosU - 0.02 * (1.0 - t);
      } else {
        partId = 0;
        const t = (v - 0.59) / 0.41;
        const shoulderSpread = Math.sin(Math.min(1.0, t * 1.25) * Math.PI * 0.5);
        const rx = 0.36 + shoulderSpread * 0.96;
        const rz = 0.28 + shoulderSpread * 0.18 * (1.0 - t * 0.3);

        const clavicle = cosU > 0
          ? Math.exp(-Math.pow((t - 0.22) / 0.09, 2)) * Math.sin(absU * 1.3) * 0.032
          : 0;
        const shoulderCap = Math.exp(-Math.pow((t - 0.65) / 0.32, 2)) * Math.pow(Math.abs(sinU), 1.7) * 0.075;
        const shoulderSlope = Math.pow(Math.abs(sinU), 1.75) * 0.24 * Math.min(1.0, t * 1.35);

        x = (rx + shoulderCap) * sinU;
        y = (0.05 - t * 0.46 - shoulderSlope) - SHOULDER_PIVOT_Y;
        z = (rz + clavicle) * cosU;

        if (cosU > 0.55 && Math.hypot(x, y + 0.04) < 0.18) {
          zone = 2;
        }
      }

      return { x, y, z, partId, zone };
    }

    function createParticleLayer(count, targetPartId) {
      const pGeo = new THREE.BufferGeometry();
      const pArr = new Float32Array(count * 3);
      const normals = new Float32Array(count * 3);
      const mArr = new Float32Array(count * 4);

      let filled = 0;
      let guard = 0;
      while (filled < count && guard < count * 10) {
        guard++;
        const v = filled % 4 === 0
          ? Math.floor(Math.random() * 72) / 72 + (Math.random() - 0.5) * 0.005
          : Math.random();
        const u = (Math.random() * 2 - 1) * Math.PI;
        const pt = sampleUpperBust(u, Math.min(0.999, Math.max(0.001, v)));
        if (pt.partId !== targetPartId) continue;

        const isInner = Math.random() < 0.22;
        const scale = isInner ? (0.72 + Math.random() * 0.22) : (0.985 + Math.random() * 0.025);

        const px = pt.x * scale;
        const py = pt.y + (Math.random() - 0.5) * 0.005;
        const pz = pt.z * scale;

        pArr[filled * 3] = px;
        pArr[filled * 3 + 1] = py;
        pArr[filled * 3 + 2] = pz;

        const len = Math.hypot(px, py * 0.4, pz) || 1;
        normals[filled * 3] = px / len;
        normals[filled * 3 + 1] = (py * 0.4) / len;
        normals[filled * 3 + 2] = pz / len;

        const rnd = Math.random();
        const sz = isInner ? (0.5 + rnd * 0.4) : (0.72 + rnd * 0.72);

        mArr[filled * 4] = rnd;
        mArr[filled * 4 + 1] = sz;
        mArr[filled * 4 + 2] = isInner ? 1.0 : 0.0;
        mArr[filled * 4 + 3] = pt.zone;
        filled++;
      }

      for (let i = filled; i < count; i++) {
        pArr[i * 3] = pArr[0] || 0;
        pArr[i * 3 + 1] = pArr[1] || 0;
        pArr[i * 3 + 2] = pArr[2] || 0;
        normals[i * 3] = 0;
        normals[i * 3 + 1] = 1;
        normals[i * 3 + 2] = 0;
        mArr[i * 4] = 0.5;
        mArr[i * 4 + 1] = 0.6;
        mArr[i * 4 + 2] = 0;
        mArr[i * 4 + 3] = 0;
      }

      pGeo.setAttribute("position", new THREE.BufferAttribute(pArr, 3));
      pGeo.setAttribute("normal", new THREE.BufferAttribute(normals, 3));
      pGeo.setAttribute("aMeta", new THREE.BufferAttribute(mArr, 4));
      return pGeo;
    }

    const bodyUniforms = {
      uTime: { value: 0 },
      uBreath: { value: 0 },
      uSpeak: { value: 0 },
      uScanY: { value: -0.5 },
      uConverge: { value: 0.0 },
      uBrainCore: { value: new THREE.Vector3(0, 0.44, 0.08) },
      uChestCore: { value: new THREE.Vector3(0, 0.04, 0.34) },
      uColorDeep: { value: new THREE.Color(currentPalette.deep) },
      uColorCyan: { value: new THREE.Color(currentPalette.primary) },
      uColorRim: { value: new THREE.Color(currentPalette.rim) },
      uColorAmber: { value: new THREE.Color(currentPalette.core) },
      uPixelRatio: { value: renderer.getPixelRatio() }
    };

    function makeBodyShaderMat(partId) {
      const worldYOffset = partId === 2 ? HEAD_PIVOT_Y : (partId === 1 ? NECK_PIVOT_Y : SHOULDER_PIVOT_Y);
      const glowExpr = partId === 2
        ? "smoothstep(0.44, 0.05, length(p - uBrainCore))"
        : (partId === 0 ? "smoothstep(0.26, 0.04, length(p - uChestCore)) * 0.85" : "0.0");

      const originExpr = partId === 2
        ? "uBrainCore"
        : (partId === 0
            ? "mix(uChestCore, vec3(0.0, 0.22, 0.14), step(0.5, rnd))"
            : "mix(uBrainCore, uChestCore, rnd)");

      return new THREE.ShaderMaterial({
        uniforms: bodyUniforms,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        vertexShader: /* glsl */ `
          uniform float uTime;
          uniform float uBreath;
          uniform float uSpeak;
          uniform float uScanY;
          uniform float uConverge;
          uniform vec3 uBrainCore;
          uniform vec3 uChestCore;
          uniform float uPixelRatio;

          attribute vec4 aMeta;
          varying float vAlpha;
          varying float vRim;
          varying float vScan;
          varying float vCoreGlow;
          varying float vMouthActive;
          varying float vCoreBurst;

          void main() {
            float rnd = aMeta.x;
            float sz = aMeta.y;
            float isInner = aMeta.z;
            float zone = aMeta.w;
            float ph = rnd * 6.28318;

            vec3 drift = vec3(
              sin(uTime * 0.9 + ph + position.y * 2.5),
              cos(uTime * 0.78 + ph * 1.2 + position.x * 2.5),
              sin(uTime * 0.85 + ph * 0.8 + position.z * 2.5)
            ) * (0.004 + isInner * 0.005);

            // 4 秒進場週期：先讓兩個金點亮起，粒子依 rnd 延遲從金點湧出、擴散並收斂成形
            float startDelay = 0.08 + rnd * 0.36;
            float span = max(0.08, 1.0 - startDelay);
            float prog = clamp((uConverge - startDelay) / span, 0.0, 1.0);
            float easeOut = 1.0 - pow(1.0 - prog, 2.8);

            vec3 goldSource = ${originExpr};
            vec3 burstDir = normalize(position - goldSource + vec3(
              sin(ph * 3.7) * 0.42,
              cos(ph * 2.9) * 0.32,
              sin(ph * 4.3) * 0.42
            ));

            float arcEnvelope = sin(prog * 3.14159);
            vec3 swirlArc = vec3(
              -burstDir.z * arcEnvelope * 0.22,
              sin(ph * 5.0 + prog * 6.28318) * arcEnvelope * 0.09,
              burstDir.x * arcEnvelope * 0.22
            );
            vec3 flyPos = goldSource + burstDir * (0.24 + rnd * 0.38) * (1.0 - easeOut * 0.65) + swirlArc;
            vec3 p = mix(flyPos, position, easeOut) * (1.0 + uBreath * 0.012) + drift;

            float hasEmergenceStarted = step(0.0001, prog);
            vCoreBurst = hasEmergenceStarted * ((1.0 - prog) * 0.85 + arcEnvelope * 0.42);
            vMouthActive = 0.0;

            if (zone > 0.5 && zone < 1.5 && uSpeak > 0.01) {
              float dyMouth = p.y - 0.14;
              float mouthMask = exp(-pow(dyMouth / 0.065, 2.0)) * exp(-pow(p.x / 0.13, 2.0));
              float cheekMask = exp(-pow((p.y - 0.16) / 0.09, 2.0)) * exp(-pow((abs(p.x) - 0.13) / 0.08, 2.0));

              float syllable = 0.5 + 0.5 * sin(uTime * 14.5 + sin(uTime * 5.2) * 2.5);
              float openAmt = syllable * uSpeak;

              float lipDir = dyMouth >= 0.0 ? 0.55 : -1.0;
              p.y += lipDir * mouthMask * openAmt * 0.032;
              p.x += sign(p.x + 0.0001) * (mouthMask * 0.018 + cheekMask * 0.014) * openAmt;
              p.z += (mouthMask * 0.026 + cheekMask * 0.012) * (0.35 + 0.65 * sin(uTime * 14.5 + p.x * 24.0)) * uSpeak;

              vMouthActive = clamp((mouthMask * 1.2 + cheekMask * 0.6) * openAmt, 0.0, 1.0);
            }

            float approxWorldY = p.y + ${worldYOffset.toFixed(2)};
            float dScan = abs(approxWorldY - uScanY);
            vScan = exp(-dScan * dScan * 45.0);
            p += normal * (vScan * 0.008);

            vCoreGlow = ${glowExpr};

            vec4 mvPos = modelViewMatrix * vec4(p, 1.0);
            vec3 viewDir = normalize(-mvPos.xyz);
            vec3 viewNorm = normalize(normalMatrix * normal);
            vRim = pow(1.0 - clamp(abs(dot(viewDir, viewNorm)), 0.0, 1.0), 1.85);

            float twinkle = 0.82 + 0.18 * sin(uTime * 2.2 + ph * 2.0);
            float spawnFade = smoothstep(0.0, 0.14, prog);
            vAlpha = ((isInner > 0.5 ? 0.22 : 0.68) * twinkle + vRim * 0.32 + vScan * 0.25 + vMouthActive * 0.35) * spawnFade;

            gl_PointSize = (sz * (12.5 + vRim * 4.0 + vScan * 3.5 + vMouthActive * 5.0 + vCoreBurst * 2.8) * uPixelRatio) / max(1.2, -mvPos.z);
            gl_Position = projectionMatrix * mvPos;
          }
        `,
        fragmentShader: /* glsl */ `
          uniform vec3 uColorDeep;
          uniform vec3 uColorCyan;
          uniform vec3 uColorRim;
          uniform vec3 uColorAmber;

          varying float vAlpha;
          varying float vRim;
          varying float vScan;
          varying float vCoreGlow;
          varying float vMouthActive;
          varying float vCoreBurst;

          void main() {
            float d = length(gl_PointCoord - vec2(0.5));
            if (d > 0.5) discard;
            float soft = pow(1.0 - d * 2.0, 1.8);

            vec3 col = mix(uColorDeep, uColorCyan, clamp(vRim * 0.9 + 0.35, 0.0, 1.0));
            col = mix(col, uColorRim, clamp(vRim * 0.8 + vScan * 0.7, 0.0, 1.0));
            col = mix(col, uColorAmber, clamp(vCoreGlow * 0.82 + vMouthActive * 0.75 + vCoreBurst * 0.72, 0.0, 1.0));

            gl_FragColor = vec4(col, soft * vAlpha);
          }
        `
      });
    }

    const headGeo = createParticleLayer(5600, 2);
    const neckGeo = createParticleLayer(2200, 1);
    const shoulderGeo = createParticleLayer(9000, 0);

    headLookGroup.add(new THREE.Points(headGeo, makeBodyShaderMat(2)));
    neckGroup.add(new THREE.Points(neckGeo, makeBodyShaderMat(1)));
    shoulderGroup.add(new THREE.Points(shoulderGeo, makeBodyShaderMat(0)));

    function makeEnergyCore(radius, count) {
      const cGeo = new THREE.BufferGeometry();
      const cPos = new Float32Array(count * 3);
      for (let i = 0; i < count; i++) {
        const r = Math.pow(Math.random(), 1.75) * radius;
        const th = Math.random() * Math.PI * 2;
        const ph = Math.acos(2 * Math.random() - 1);
        cPos[i * 3] = r * Math.sin(ph) * Math.cos(th);
        cPos[i * 3 + 1] = r * Math.cos(ph);
        cPos[i * 3 + 2] = r * Math.sin(ph) * Math.sin(th) * 0.85;
      }
      cGeo.setAttribute("position", new THREE.BufferAttribute(cPos, 3));
      const cMat = new THREE.PointsMaterial({
        color: 0xffb84d,
        size: 0.025,
        transparent: true,
        opacity: 0.86,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      return new THREE.Points(cGeo, cMat);
    }

    const brainCore = makeEnergyCore(0.21, 920);
    brainCore.position.set(0, 0.44, 0.08);
    headLookGroup.add(brainCore);

    const chestCore = makeEnergyCore(0.12, 450);
    chestCore.position.set(0, 0.04, 0.34);
    shoulderGroup.add(chestCore);

    const hudRingMat = new THREE.LineBasicMaterial({
      color: currentPalette.primary,
      transparent: true,
      opacity: 0.22,
      blending: THREE.AdditiveBlending
    });
    function buildRing(radius) {
      const pts = [];
      for (let i = 0; i <= 128; i++) {
        const a = (i / 128) * Math.PI * 2;
        pts.push(new THREE.Vector3(Math.cos(a) * radius, Math.sin(a) * radius, -0.35));
      }
      return new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), hudRingMat);
    }
    const outerHudRing = buildRing(1.35);
    const innerHudRing = buildRing(1.02);
    scene.add(outerHudRing, innerHudRing);

    const scanConeGeo = new THREE.ConeGeometry(0.95, 1.85, 32, 1, true);
    const scanConeMat = new THREE.MeshBasicMaterial({
      color: currentPalette.primary,
      transparent: true,
      opacity: 0.045,
      side: THREE.DoubleSide,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const scanCone = new THREE.Mesh(scanConeGeo, scanConeMat);
    scanCone.position.set(0.35, 0.35, -0.1);
    scanCone.rotation.z = -0.65;
    scene.add(scanCone);

    const waveCanvas = document.getElementById("waveCanvas");
    const wCtx = waveCanvas.getContext("2d");

    function drawAudioWave(t, speakLevel) {
      const w = waveCanvas.width;
      const h = waveCanvas.height;
      wCtx.clearRect(0, 0, w, h);

      wCtx.beginPath();
      for (let x = 0; x <= w; x += 3) {
        const nx = x / w;
        const amp = (4 + speakLevel * 15) * Math.sin(nx * Math.PI);
        const y = h * 0.35 + Math.sin(nx * 18 - t * 9) * amp * 0.6 + Math.cos(nx * 9 + t * 5) * amp * 0.4;
        if (x === 0) wCtx.moveTo(x, y);
        else wCtx.lineTo(x, y);
      }
      wCtx.strokeStyle = "rgba(85, 218, 255, 0.85)";
      wCtx.lineWidth = 1.4;
      wCtx.stroke();

      const bars = 24;
      const barW = w / bars;
      for (let i = 0; i < bars; i++) {
        const val = 0.2 + 0.8 * Math.abs(Math.sin(t * 6 + i * 0.55)) * (0.3 + speakLevel);
        const bh = Math.max(2, val * 14);
        wCtx.fillStyle = i < 16 ? "rgba(60, 210, 255, 0.75)" : "rgba(255, 175, 65, 0.75)";
        wCtx.fillRect(i * barW + 1, h - bh - 2, barW - 3, bh);
      }
    }

    function handleCommand(rawText) {
      const text = rawText.trim();
      if (!text) return;

      appendMessage("我", text);

      for (const themeName of Object.keys(THEMES)) {
        if (text.includes(themeName)) {
          applyThemeUI(themeName);
          appendMessage("JARVIS", `已將全像光譜切換為「${themeName}」。`);
          triggerSpeakingFor(2200);
          return;
        }
      }

      if (text.includes("幾點") || text.includes("時間")) {
        appendMessage("JARVIS", `現在時間是 ${formatTimeNow()}。`);
        triggerSpeakingFor(2400);
        return;
      }
      if (text.includes("思考")) {
        applyStateUI("THINKING");
        appendMessage("JARVIS", "正在進行神經矩陣運算與推理分析。");
        return;
      }
      if (text.includes("說話") || text.includes("回答")) {
        appendMessage("JARVIS", "語音輸出模組已啟動，我正在跟你說話，你可以觀察我嘴巴附近的粒子律動。");
        triggerSpeakingFor(4500);
        return;
      }
      if (text.includes("鏡頭")) {
        applyStateUI("CAMERA_MODE");
        appendMessage("JARVIS", "已開啟即時光學鏡頭視窗。");
        triggerSpeakingFor(2000);
        return;
      }
      if (text.includes("待機")) {
        if (speakTimerId) clearTimeout(speakTimerId);
        applyStateUI("IDLE");
        appendMessage("JARVIS", "已回到待命狀態。");
        return;
      }

      appendMessage("JARVIS", `收到你說的：「${text}」，全像系統已同步。`);
      triggerSpeakingFor(2800);
    }

    document.getElementById("sendCmdBtn").addEventListener("click", () => {
      const val = cmdInputEl.value;
      cmdInputEl.value = "";
      handleCommand(val);
      if (ws && ws.readyState === WebSocket.OPEN && val.trim()) {
        ws.send(JSON.stringify({ action: "command", text: val.trim() }));
      }
    });
    cmdInputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        document.getElementById("sendCmdBtn").click();
      }
    });
    document.getElementById("switchModeBtn").addEventListener("click", () => {
      const next = modeSelectEl.value;
      if (speakTimerId) clearTimeout(speakTimerId);
      applyStateUI(next);
      appendMessage("JARVIS", `已切換至「${STATE_ZH[next]}」模式。`);
      if (next === "SPEAKING") {
        speakTimerId = setTimeout(() => {
          if (currentState === "SPEAKING") applyStateUI("IDLE", true);
        }, 5000);
      }
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ action: "set_state", state: next }));
      }
    });

    let ws = null;
    function connectLegacySocket() {
      try {
        ws = new WebSocket("ws://127.0.0.1:8766");
        ws.onopen = () => {
          document.getElementById("sysLink").textContent = "已連線";
        };
        ws.onmessage = (ev) => {
          let msg = null;
          try { msg = JSON.parse(ev.data); } catch (_) { return; }
          if (!msg) return;

          if (msg.type === "sync" || msg.type === "state") {
            applyStateUI(msg.state);
          } else if (msg.type === "theme" && msg.theme_name) {
            applyThemeUI(msg.theme_name);
          }

          const userSay = msg.user_speech || msg.user_text || msg.transcript || (msg.type === "asr" ? (msg.text || msg.message) : "");
          if (userSay) {
            appendMessage("我", userSay);
          }

          const botReply = msg.response || msg.reply || msg.assistant_text || (msg.type === "message" ? msg.message : "");
          if (botReply) {
            appendMessage("JARVIS", botReply);
            triggerSpeakingFor(Math.max(2200, Math.min(6000, String(botReply).length * 140)));
          } else if (msg.type === "status" && msg.message) {
            pushEventLog(msg.message);
          }

          if (msg.type === "camera_frame" && msg.jpeg_b64) {
            camDockEl.style.display = "block";
            camImgEl.src = "data:image/jpeg;base64," + msg.jpeg_b64;
          }
        };
        ws.onclose = () => {
          document.getElementById("sysLink").textContent = "離線重連中";
          setTimeout(connectLegacySocket, 3000);
        };
      } catch (_) {}
    }
    connectLegacySocket();

    // 開機光束與語音播報
    const GREETING_MSG = "我是賈維斯，需要我幫助你做什麼？";
    const bootFlashEl = document.getElementById("bootFlash");
    let hasSpokenGreeting = false;

    function speakGreeting() {
      if (hasSpokenGreeting) return;
      hasSpokenGreeting = true;
      appendMessage("JARVIS", GREETING_MSG);
      triggerSpeakingFor(3400);

      if ("speechSynthesis" in window) {
        try {
          window.speechSynthesis.cancel();
          const utter = new SpeechSynthesisUtterance(GREETING_MSG);
          const voices = window.speechSynthesis.getVoices() || [];
          const zhVoice = voices.find((v) => /zh/i.test(v.lang));
          if (zhVoice) utter.voice = zhVoice;
          utter.lang = "zh-TW";
          utter.rate = 0.98;
          utter.pitch = 0.9;
          utter.onend = () => {
            if (speakTimerId) clearTimeout(speakTimerId);
            applyStateUI("IDLE", true);
          };
          window.speechSynthesis.speak(utter);
        } catch (_) {}
      }
    }

    function startLightBoot() {
      requestAnimationFrame(() => {
        bootFlashEl.classList.add("expand");
      });

      setTimeout(() => {
        speakGreeting();
      }, 1400);

      setTimeout(() => {
        bootFlashEl.classList.add("done");
        setTimeout(() => {
          if (bootFlashEl && bootFlashEl.parentNode) {
            bootFlashEl.remove();
          }
        }, 950);
      }, 2300);
    }

    window.addEventListener("pointerdown", () => {
      if (!hasSpokenGreeting) speakGreeting();
    }, { once: true });

    let mouseNdcX = 0;
    let mouseNdcY = 0;
    let smoothYaw = 0;
    let smoothPitch = 0;

    window.addEventListener("mousemove", (e) => {
      mouseNdcX = (e.clientX / window.innerWidth) * 2 - 1;
      mouseNdcY = -((e.clientY / window.innerHeight) * 2 - 1);
    });

    const clock = new THREE.Clock();
    let frameCnt = 0;
    let fpsLast = performance.now();
    const telClockEl = document.getElementById("telClock");
    const telUptimeEl = document.getElementById("telUptime");
    const telFpsEl = document.getElementById("telFps");
    const telViewportEl = document.getElementById("telViewport");

    function updateViewportLabel() {
      telViewportEl.textContent = `${window.innerWidth}x${window.innerHeight}`;
    }
    updateViewportLabel();

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      const breath = 0.5 + 0.5 * Math.sin(t * 1.7);
      const scanY = -0.45 + ((t * 0.2) % 1.0) * 1.55;
      const converge = Math.min(1.0, t / 4.0);

      let speakLevel = 0.0;
      if (currentState === "SPEAKING") {
        const envelope = 0.55 + 0.45 * Math.sin(t * 3.1);
        const fastSyllable = 0.5 + 0.5 * Math.sin(t * 14.5 + Math.cos(t * 6.3) * 2.0);
        speakLevel = Math.min(1.0, (0.35 + fastSyllable * 0.65) * envelope);
      } else if (currentState === "THINKING") {
        speakLevel = 0.16 + 0.08 * Math.sin(t * 5.0);
      } else if (currentState === "LISTENING") {
        speakLevel = 0.12;
      }

      const targetYaw = mouseNdcX * 0.24;
      const targetPitch = -mouseNdcY * 0.15;
      smoothYaw += (targetYaw - smoothYaw) * 0.055;
      smoothPitch += (targetPitch - smoothPitch) * 0.055;

      shoulderGroup.rotation.y = smoothYaw * 0.14;
      shoulderGroup.rotation.x = smoothPitch * 0.10 + Math.sin(t * 1.7) * 0.008;

      neckGroup.rotation.y = smoothYaw * 0.30;
      neckGroup.rotation.x = smoothPitch * 0.25;

      headLookGroup.rotation.y = smoothYaw * 0.56;
      headLookGroup.rotation.x = smoothPitch * 0.65;

      bodyUniforms.uTime.value = t;
      bodyUniforms.uBreath.value = breath;
      bodyUniforms.uSpeak.value = speakLevel;
      bodyUniforms.uScanY.value = scanY;
      bodyUniforms.uConverge.value = converge;

      const coreScale = 0.65 + 0.35 * Math.min(1.0, t / 0.6);
      brainCore.scale.setScalar(coreScale);
      chestCore.scale.setScalar(coreScale);

      brainCore.rotation.y = t * 0.45;
      brainCore.rotation.x = Math.sin(t * 0.8) * 0.25;
      chestCore.rotation.y = -t * 0.55;
      outerHudRing.rotation.z = t * 0.12;
      innerHudRing.rotation.z = -t * 0.18;
      bgStars.rotation.y = t * 0.015;

      drawAudioWave(t, speakLevel);
      composer.render();

      frameCnt++;
      const now = performance.now();
      if (now - fpsLast >= 1000) {
        telFpsEl.textContent = String(Math.round((frameCnt * 1000) / (now - fpsLast)));
        telClockEl.textContent = formatTimeNow();
        const secTotal = Math.floor((now - startTimeMs) / 1000);
        const hh = String(Math.floor(secTotal / 3600)).padStart(2, "0");
        const mm = String(Math.floor((secTotal % 3600) / 60)).padStart(2, "0");
        const ss = String(secTotal % 60).padStart(2, "0");
        telUptimeEl.textContent = `${hh}:${mm}:${ss}`;
        frameCnt = 0;
        fpsLast = now;
      }
    }

    window.addEventListener("resize", () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const pr = Math.min(window.devicePixelRatio, 2);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      renderer.setPixelRatio(pr);
      composer.setSize(w, h);
      bloomPass.setSize(w, h);
      bodyUniforms.uPixelRatio.value = pr;
      updateViewportLabel();
    });

    startLightBoot();
    animate();
  </script>
</body>
</html>
