<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>J.A.R.V.I.S. // 精密粒子人形核心</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background:
        radial-gradient(circle at 50% 38%, rgba(16, 44, 84, 0.55) 0%, rgba(5, 11, 24, 0.92) 55%, #02050b 100%);
      color: #e8f6ff;
      font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    canvas#hudCanvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .scan-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.015) 0px,
          rgba(255, 255, 255, 0.015) 1px,
          transparent 1px,
          transparent 4px
        );
      opacity: 0.55;
    }
    .top-bar {
      position: fixed;
      top: 18px;
      left: 24px;
      right: 24px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      pointer-events: none;
      z-index: 10;
    }
    .hud-panel {
      background: rgba(6, 16, 32, 0.82);
      border: 1px solid rgba(0, 180, 255, 0.35);
      box-shadow: 0 0 22px rgba(0, 168, 255, 0.14), inset 0 0 14px rgba(0, 168, 255, 0.06);
      padding: 9px 15px;
      border-radius: 6px;
      font-size: 12.5px;
      letter-spacing: 1px;
      backdrop-filter: blur(8px);
    }
    .hud-panel .val {
      font-weight: 700;
      margin-left: 6px;
    }
    .status-banner {
      position: fixed;
      bottom: 74px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(6, 17, 35, 0.9);
      border: 1px solid rgba(0, 180, 255, 0.35);
      padding: 8px 18px;
      border-radius: 7px;
      font-size: 13px;
      max-width: 92vw;
      text-align: center;
      z-index: 10;
    }
    .cmd-bar {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      align-items: center;
      background: rgba(6, 16, 33, 0.9);
      border: 1px solid rgba(0, 180, 255, 0.35);
      padding: 9px 13px;
      border-radius: 9px;
      backdrop-filter: blur(10px);
      z-index: 10;
    }
    .cmd-bar input,
    .cmd-bar button,
    .cmd-bar select {
      background: rgba(12, 30, 58, 0.78);
      color: #f0f9ff;
      border: 1px solid rgba(0, 180, 255, 0.36);
      border-radius: 5px;
      padding: 6px 10px;
      font-size: 12.5px;
      outline: none;
    }
    .cmd-bar button {
      cursor: pointer;
      font-weight: 600;
      background: rgba(0, 168, 255, 0.24);
    }
    .cmd-bar button:hover {
      background: rgba(0, 168, 255, 0.42);
    }
  </style>
</head>
<body>
  <div class="scan-overlay"></div>
  <canvas id="hudCanvas"></canvas>

  <div class="top-bar">
    <div class="hud-panel" id="statePanel">MODE // <span class="val" id="stateText">IDLE</span></div>
    <div class="hud-panel" id="themePanel">OPTIC // <span class="val" id="themeText">海洋藍</span></div>
  </div>

  <div class="status-banner" id="bannerText">連線至 ws://127.0.0.1:8766 中...</div>

  <div class="cmd-bar">
    <input id="cmdInput" type="text" size="34" placeholder="輸入：賈維斯把你的主題切換成紅色" />
    <button id="cmdBtn">送出</button>
    <select id="stateSelect">
      <option value="IDLE">IDLE</option>
      <option value="LISTENING">LISTENING</option>
      <option value="THINKING">THINKING</option>
      <option value="SPEAKING">SPEAKING</option>
      <option value="CAMERA_MODE">CAMERA_MODE</option>
    </select>
    <button id="stateBtn">狀態</button>
  </div>

  <script>
    const canvas = document.getElementById("hudCanvas");
    const ctx = canvas.getContext("2d");
    const stateText = document.getElementById("stateText");
    const themeText = document.getElementById("themeText");
    const statePanel = document.getElementById("statePanel");
    const themePanel = document.getElementById("themePanel");
    const bannerText = document.getElementById("bannerText");
    const cmdInput = document.getElementById("cmdInput");
    const cmdBtn = document.getElementById("cmdBtn");
    const stateSelect = document.getElementById("stateSelect");
    const stateBtn = document.getElementById("stateBtn");

    let currentState = "IDLE";
    let currentTheme = "海洋藍";
    let palette = { primary: "#00A8FF", core: "#FF9E2C", glow: "#0066CC" };

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.floor(window.innerWidth * dpr);
      canvas.height = Math.floor(window.innerHeight * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener("resize", resize);
    resize();

    function parseHex(hex) {
      const clean = (hex || "#00A8FF").replace("#", "");
      const num = parseInt(clean.length === 6 ? clean : "00A8FF", 16);
      return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
    }
    function rgba(hex, alpha) {
      const { r, g, b } = parseHex(hex);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    // 精細解剖骨架節點（頭部、眼眶/護目線、下顎、頸部、鎖骨、胸廓、脊椎、肩關節、手臂、核心）
    const skeletonBones = [
      // 頭部外輪廓與下顎
      [[-26, -198], [0, -214], [26, -198]],
      [[26, -198], [34, -172], [28, -148]],
      [[28, -148], [16, -132], [0, -126]],
      [[0, -126], [-16, -132], [-28, -148]],
      [[-28, -148], [-34, -172], [-26, -198]],
      // 護目 visor 與中線
      [[-24, -174], [-8, -177], [0, -174], [8, -177], [24, -174]],
      [[0, -208], [0, -130]],
      // 頸部與鎖骨
      [[-12, -125], [-14, -104]],
      [[12, -125], [14, -104]],
      [[-14, -104], [-58, -96], [-108, -78]],
      [[14, -104], [58, -96], [108, -78]],
      // 胸廓與肋骨線
      [[-108, -78], [-82, -12], [-56, 42]],
      [[108, -78], [82, -12], [56, 42]],
      [[-56, 42], [0, 56], [56, 42]],
      [[0, -104], [0, 52]],
      [[-68, -56], [0, -50], [68, -56]],
      [[-62, -24], [0, -18], [62, -24]],
      [[-54, 10], [0, 14], [54, 10]],
      // 左臂（肩 -> 肘 -> 腕 -> 掌）
      [[-108, -78], [-136, -24], [-152, 34]],
      [[-152, 34], [-164, 88], [-168, 128]],
      // 右臂（肩 -> 肘 -> 腕 -> 掌）
      [[108, -78], [136, -24], [152, 34]],
      [[152, 34], [164, 88], [168, 128]]
    ];

    function buildDetailedParticles(total = 3600) {
      const pts = [];
      for (let i = 0; i < total; i++) {
        const r = Math.random();
        let bx = 0, by = 0, z = 0.4 + Math.random() * 0.6, kind = "shell";

        if (r < 0.22) {
          // 頭部精密輪廓與顱內網格
          kind = "head";
          const ang = Math.random() * Math.PI * 2;
          const rim = Math.random() < 0.72;
          const rx = rim ? 31 + (Math.random() - 0.5) * 4 : Math.random() * 25;
          const ry = rim ? 42 + (Math.random() - 0.5) * 5 : Math.random() * 36;
          bx = Math.cos(ang) * rx;
          by = -170 + Math.sin(ang) * ry * (Math.sin(ang) > 0 ? 0.92 : 1.05);
        } else if (r < 0.56) {
          // 軀幹肌肉/裝甲線條分布
          kind = "torso";
          const yNorm = Math.random(); // 0: 鎖骨, 1: 腰腹
          by = -100 + yNorm * 152;
          const halfW = 104 * (1 - yNorm * 0.45) + Math.sin(yNorm * Math.PI) * 14;
          const edge = Math.pow(Math.random(), 0.45);
          const side = Math.random() < 0.5 ? -1 : 1;
          bx = side * halfW * edge;
        } else if (r < 0.78) {
          // 左右雙臂分段
          kind = "arms";
          const side = i % 2 === 0 ? 1 : -1;
          const t = Math.random();
          if (t < 0.5) {
            const u = t / 0.5;
            bx = side * (108 + u * 44) + (Math.random() - 0.5) * 10;
            by = -78 + u * 112 + (Math.random() - 0.5) * 8;
          } else {
            const u = (t - 0.5) / 0.5;
            bx = side * (152 + u * 16) + (Math.random() - 0.5) * 8;
            by = 34 + u * 94 + (Math.random() - 0.5) * 8;
          }
        } else if (r < 0.88) {
          // 胸核周圍能量環粒子
          kind = "coreRing";
          const ang = Math.random() * Math.PI * 2;
          const rad = 26 + (Math.random() - 0.5) * 8;
          bx = Math.cos(ang) * rad;
          by = -36 + Math.sin(ang) * rad;
        } else {
          // 背景資料微粒
          kind = "field";
          const ang = Math.random() * Math.PI * 2;
          const dist = 165 + Math.random() * 270;
          bx = Math.cos(ang) * dist * 1.3;
          by = -55 + Math.sin(ang) * dist * 0.85;
          z = 0.2 + Math.random() * 0.5;
        }

        pts.push({
          bx, by, x: bx, y: by, z, kind,
          phase: Math.random() * Math.PI * 2,
          freq: 0.7 + Math.random() * 1.5,
          size: kind === "field" ? 0.9 + Math.random() * 1.2 : 1.0 + Math.random() * 1.85,
          alpha: kind === "field" ? 0.16 + Math.random() * 0.28 : 0.45 + Math.random() * 0.5
        });
      }
      return pts;
    }

    const particles = buildDetailedParticles(3600);

    function syncVisualMeta() {
      stateText.textContent = currentState;
      themeText.textContent = currentTheme;
      const activeCol = currentState === "CAMERA_MODE" ? palette.core : palette.primary;
      stateText.style.color = activeCol;
      themeText.style.color = palette.primary;
      statePanel.style.borderColor = rgba(activeCol, 0.6);
      themePanel.style.borderColor = rgba(palette.primary, 0.55);
      stateSelect.value = currentState;
    }

    let ws = null;
    function connectSocket() {
      ws = new WebSocket("ws://127.0.0.1:8766");
      ws.onopen = () => {
        bannerText.textContent = "已連線至全像核心，待機中。";
      };
      ws.onmessage = (ev) => {
        const msg = JSON.parse(ev.data);
        if (msg.type === "sync") {
          currentState = msg.state || "IDLE";
          currentTheme = msg.theme_name || "海洋藍";
          if (msg.palette) palette = { ...palette, ...msg.palette };
          syncVisualMeta();
        } else if (msg.type === "theme") {
          currentTheme = msg.theme_name || currentTheme;
          if (msg.palette) palette = { ...palette, ...msg.palette };
          syncVisualMeta();
          bannerText.textContent = `主題已切換為「${currentTheme}」。`;
        } else if (msg.type === "state") {
          currentState = msg.state || currentState;
          syncVisualMeta();
        } else if (msg.type === "notify") {
          bannerText.textContent = msg.message || "";
        } else if (msg.type === "response") {
          bannerText.textContent = msg.message || "";
          bannerText.style.borderColor = msg.ok ? rgba(palette.primary, 0.6) : "rgba(255, 82, 82, 0.75)";
        }
      };
      ws.onerror = () => {
        bannerText.textContent = "尚未連上 ws://127.0.0.1:8766。";
      };
      ws.onclose = () => {
        setTimeout(connectSocket, 2000);
      };
    }
    connectSocket();

    function submitCmd() {
      const val = cmdInput.value.trim();
      if (!val || !ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({ action: "command", text: val }));
      cmdInput.value = "";
    }
    cmdBtn.addEventListener("click", submitCmd);
    cmdInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") submitCmd();
    });
    stateBtn.addEventListener("click", () => {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({ action: "set_state", state: stateSelect.value }));
    });

    function drawSkeleton(cx, cy, time) {
      ctx.save();
      ctx.strokeStyle = rgba(palette.primary, 0.24);
      ctx.lineWidth = 1.1;
      for (const chain of skeletonBones) {
        ctx.beginPath();
        for (let i = 0; i < chain.length; i++) {
          const [px, py] = chain[i];
          const sx = cx + px + Math.sin(time * 1.4 + py * 0.03) * 1.4;
          const sy = cy + py;
          if (i === 0) ctx.moveTo(sx, sy);
          else ctx.lineTo(sx, sy);
        }
        ctx.stroke();
      }

      // 雙眼高光節點
      const eyePulse = 0.75 + 0.25 * Math.sin(time * 5);
      for (const ex of [-11, 11]) {
        ctx.fillStyle = rgba(palette.core, eyePulse);
        ctx.beginPath();
        ctx.arc(cx + ex, cy - 175, 2.6, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function drawTechRings(cx, cy, time) {
      ctx.save();
      ctx.translate(cx, cy - 36);

      // 外圈刻度環
      ctx.save();
      ctx.rotate(time * (currentState === "THINKING" ? 1.5 : 0.28));
      ctx.strokeStyle = rgba(palette.primary, 0.45);
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.arc(0, 0, 232, 0, Math.PI * 2);
      ctx.stroke();

      for (let i = 0; i < 24; i++) {
        const a = (i / 24) * Math.PI * 2;
        const rInner = 225;
        const rOuter = i % 4 === 0 ? 240 : 233;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * rInner, Math.sin(a) * rInner);
        ctx.lineTo(Math.cos(a) * rOuter, Math.sin(a) * rOuter);
        ctx.stroke();
      }
      ctx.restore();

      // 內圈分段弧線
      ctx.save();
      ctx.rotate(-time * (currentState === "SPEAKING" ? 1.9 : 0.6));
      ctx.strokeStyle = rgba(palette.core, 0.55);
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.arc(0, 0, 196, 0.15, 1.25);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(0, 0, 196, Math.PI + 0.15, Math.PI + 1.25);
      ctx.stroke();
      ctx.restore();

      // 垂直掃描光束
      const scanY = Math.sin(time * 1.5) * 185;
      const grad = ctx.createLinearGradient(-210, scanY, 210, scanY);
      grad.addColorStop(0, "transparent");
      grad.addColorStop(0.5, rgba(palette.primary, 0.35));
      grad.addColorStop(1, "transparent");
      ctx.fillStyle = grad;
      ctx.fillRect(-210, scanY - 1, 420, 2);

      ctx.restore();
    }

    let clock = 0;
    function frame() {
      clock += 0.016;
      const w = window.innerWidth;
      const h = window.innerHeight;
      const cx = w / 2;
      const cy = h / 2 + 28;

      ctx.globalCompositeOperation = "source-over";
      ctx.fillStyle = "rgba(3, 8, 18, 0.34)";
      ctx.fillRect(0, 0, w, h);

      drawTechRings(cx, cy, clock);
      drawSkeleton(cx, cy, clock);

      let speed = 1.0;
      let amp = 2.6;
      let coreScale = 1.0;
      if (currentState === "LISTENING") {
        speed = 1.6; amp = 5.2; coreScale = 1.2 + Math.sin(clock * 8) * 0.2;
      } else if (currentState === "THINKING") {
        speed = 2.7; amp = 7.5; coreScale = 1.15 + Math.cos(clock * 12) * 0.25;
      } else if (currentState === "SPEAKING") {
        speed = 2.0; amp = 6.5; coreScale = 1.3 + Math.abs(Math.sin(clock * 13)) * 0.45;
      } else if (currentState === "CAMERA_MODE") {
        speed = 1.3; amp = 3.2; coreScale = 1.15;
      } else {
        coreScale = 1.0 + Math.sin(clock * 2.4) * 0.1;
      }

      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        const ox = Math.sin(clock * speed * p.freq + p.phase) * amp * p.z;
        const oy = Math.cos(clock * speed * p.freq * 1.1 + p.phase) * amp * p.z;
        const tx = cx + p.bx + ox;
        const ty = cy + p.by + oy;
        p.x += (tx - p.x) * 0.14;
        p.y += (ty - p.y) * 0.14;

        const flicker = 0.7 + 0.3 * Math.sin(clock * 3.5 + p.phase);
        const col = p.kind === "coreRing" ? palette.core : palette.primary;
        ctx.fillStyle = rgba(col, p.alpha * flicker);
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * (0.7 + 0.35 * p.z), 0, Math.PI * 2);
        ctx.fill();
      }

      // 胸口反應爐核心光暈
      const rCore = 24 * coreScale;
      const gCore = ctx.createRadialGradient(cx, cy - 36, 1, cx, cy - 36, rCore * 3);
      gCore.addColorStop(0, "rgba(255,255,255,0.95)");
      gCore.addColorStop(0.3, rgba(palette.core, 0.88));
      gCore.addColorStop(0.7, rgba(palette.core, 0.2));
      gCore.addColorStop(1, "transparent");
      ctx.fillStyle = gCore;
      ctx.beginPath();
      ctx.arc(cx, cy - 36, rCore * 3, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
      requestAnimationFrame(frame);
    }
    frame();
  </script>
</body>
</html>
